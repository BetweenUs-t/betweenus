<!DOCTYPE html>
<html>
<head>
  <title>BetweenUs</title>
  <style>
    body {
      font-family: Arial;
      background: #0f0f14;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: #1a1a22;
      padding: 20px;
      border-radius: 16px;
      margin: 15px auto;
      width: 90%;
      max-width: 400px;
    }

    textarea {
      width: 90%;
      height: 80px;
      border-radius: 10px;
      border: none;
      padding: 10px;
      margin-top: 10px;
    }

    button {
      background: white;
      color: black;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      margin-top: 10px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }

    .msg {
      background: #2a2a35;
      padding: 10px;
      border-radius: 10px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h2>BetweenUs 💭</h2>

  <div class="card">
    <h3>อยากบ่นอะไรไหม?</h3>
    <textarea id="inputText"></textarea><br>
    <button onclick="sendMessage()">ส่งข้อความ</button>
  </div>

  <div class="card">
    <h3>สุ่มข้อความจากคนอื่น</h3>
    <button onclick="getRandom()">สุ่ม</button>
    <div id="randomBox"></div>

    <textarea id="replyText" placeholder="พิมพ์กำลังใจ..."></textarea><br>
    <button onclick="sendReply()">ส่งกำลังใจ</button>
  </div>

  <div class="card">
    <h3>📥 ก๊อกๆ มีคนฝากมา</h3>
    <div id="inbox"></div>
  </div>

<script>
  let myId = localStorage.getItem("myId");
  if (!myId) {
    myId = "user_" + Math.random();
    localStorage.setItem("myId", myId);
  }

  function sendMessage() {
    let text = document.getElementById("inputText").value;

    let messages = JSON.parse(localStorage.getItem("messages")) || [];
    messages.push({
      text: text,
      id: Date.now(),
      owner: myId
    });

    localStorage.setItem("messages", JSON.stringify(messages));
    alert("ส่งแล้ว🫀");
  }

  let currentRandom = null;

  function getRandom() {
    let messages = JSON.parse(localStorage.getItem("messages")) || [];

    let others = messages.filter(m => m.owner !== myId);

    if (others.length === 0) {
      document.getElementById("randomBox").innerText = "ยังไม่มีข้อความจากคนอื่น";
      return;
    }

    let rand = others[Math.floor(Math.random() * others.length)];
    currentRandom = rand;

    document.getElementById("randomBox").innerText = rand.text;
  }

  function sendReply() {
    let reply = document.getElementById("replyText").value;

    if (!currentRandom) {
      alert("ต้องสุ่มก่อน!");
      return;
    }

    let inbox = JSON.parse(localStorage.getItem("inbox_" + currentRandom.owner)) || [];

    inbox.push({
      text: reply
    });

    localStorage.setItem("inbox_" + currentRandom.owner, JSON.stringify(inbox));

    alert("หนุนใจแล้วนะ🫀");
  }

  function loadInbox() {
    let inbox = JSON.parse(localStorage.getItem("inbox_" + myId)) || [];

    let box = document.getElementById("inbox");
    box.innerHTML = "";

    inbox.forEach(msg => {
      let div = document.createElement("div");
      div.className = "msg";
      div.innerText = msg.text;
      box.appendChild(div);
    });
  }

  loadInbox();
</script>

</body>
</html>
