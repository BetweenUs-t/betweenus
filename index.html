<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>BetweenUs</title>

  <!-- ✅ PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- ✅ Font -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background: #0f0f14;
      color: white;
      text-align: center;
      padding: 20px;
      transition: 0.3s;
    }

    .light {
      background: #f5f5f5;
      color: black;
    }

    h2 {
      margin-bottom: 5px;
    }

    .card {
      background: #1a1a22;
      padding: 20px;
      border-radius: 16px;
      margin: 15px auto;
      width: 90%;
      max-width: 400px;
      position: relative;
      overflow: hidden;
    }

    .light .card {
      background: white;
    }

    /* 👥 เงาคนกอดกัน */
    .card::before {
      content: "";
      position: absolute;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(255,255,255,0.08), transparent);
      top: -50px;
      right: -50px;
      border-radius: 50%;
    }

    textarea {
      width: 90%;
      height: 80px;
      border-radius: 10px;
      border: none;
      padding: 10px;
      margin-top: 10px;
      font-family: 'Kanit', sans-serif;
    }

    button {
      background: white;
      color: black;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      margin-top: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.8;
    }

    .msg {
      background: #2a2a35;
      padding: 12px;
      border-radius: 15px;
      margin-top: 10px;
      text-align: left;
      animation: fadeIn 0.3s ease;
    }

    .light .msg {
      background: #e0e0e0;
    }

    @keyframes fadeIn {
      from {opacity:0; transform: translateY(10px);}
      to {opacity:1; transform: translateY(0);}
    }

    /* ❤️ ปุ่มขอบคุณ */
    .heart {
      cursor: pointer;
      font-size: 18px;
      transition: 0.2s;
    }

    .heart:active {
      transform: scale(1.5);
    }

    /* 🔔 notification bubble */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      color: black;
      padding: 10px 20px;
      border-radius: 20px;
      display: none;
    }

  </style>
</head>

<body>

<h2>BetweenUs 💭</h2>

<button onclick="toggleTheme()">🎨 เปลี่ยนธีม</button>

<div class="card">
  <h3>ระบาย</h3>
  <textarea id="input"></textarea><br>
  <button onclick="send()">ส่ง</button>
</div>

<div class="card">
  <h3>สุ่มกำลังใจ</h3>
  <button onclick="randomMsg()">สุ่ม</button>
  <div id="result"></div>
</div>

<div class="toast" id="toast">📩 มีข้อความใหม่</div>

<script>
  let messages = JSON.parse(localStorage.getItem("msgs")) || [];

  function send() {
    const input = document.getElementById("input");
    const text = input.value.trim();

    if (!text) return;

    messages.push(text);
    localStorage.setItem("msgs", JSON.stringify(messages));

    input.value = "";

    showToast("ส่งแล้ว 💌");
  }

  function randomMsg() {
    if (messages.length === 0) {
      alert("ยังไม่มีข้อความ");
      return;
    }

    const index = Math.floor(Math.random() * messages.length);
    const msg = messages[index];

    document.getElementById("result").innerHTML = `
      <div class="msg">
        ${msg}
        <div class="heart" onclick="thank()">❤️</div>
      </div>
    `;
  }

  function thank() {
    showToast("ขอบคุณแล้ว ❤️");
  }

  function showToast(text) {
    const toast = document.getElementById("toast");
    toast.innerText = text;
    toast.style.display = "block";

    setTimeout(() => {
      toast.style.display = "none";
    }, 2000);
  }

  function toggleTheme() {
    document.body.classList.toggle("light");
  }
</script>

</body>
</html>
