<!DOCTYPE html>
<html>
<head>
  <title>BetweenUs</title>

  <!-- 🔤 FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400&display=swap" rel="stylesheet">

  <!-- 🔥 Firebase (เวอร์ชันแก้บัค) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background: #0f0f14;
      color: white;
      margin: 0;
      text-align: center;
    }

    /* เงาคนกอด (ฟีล abstract) */
    body::before {
      content: "";
      position: fixed;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 30% 40%, rgba(255,255,255,0.05), transparent),
        radial-gradient(circle at 70% 60%, rgba(255,255,255,0.04), transparent);
      z-index: -1;
    }

    .card {
      background: #1a1a22;
      padding: 20px;
      border-radius: 16px;
      margin: 15px auto;
      width: 90%;
      max-width: 400px;
    }

    textarea {
      width: 90%;
      height: 80px;
      border-radius: 10px;
      border: none;
      padding: 10px;
      font-family: 'Kanit';
    }

    button {
      background: white;
      color: black;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      margin-top: 10px;
      cursor: pointer;
    }

    .msg {
      background: #2a2a35;
      padding: 12px;
      border-radius: 12px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<h2>BetweenUs 💭</h2>

<div class="card">
  <h3>ระบาย</h3>
  <textarea id="input"></textarea><br>
  <button onclick="send()">ส่ง</button>
</div>

<div class="card">
  <h3>ข้อความของคุณ</h3>
  <div id="randomMsg" class="msg">กดรับข้อความ</div>
  <button onclick="draw()">รับข้อความ</button>

  <textarea id="reply" placeholder="เขียนกำลังใจ..."></textarea><br>
  <button onclick="sendReply()">ส่งกำลังใจ</button>
</div>

<div class="card">
  <h3>กำลังใจที่คุณได้รับ</h3>
  <div id="inbox"></div>
</div>

<script>
/* 🔥 CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyBDKVbIJUrqA_GjpYRbJjor8hfIrd2HGLY",
  authDomain: "betweenus-ae90e.firebaseapp.com",
  projectId: "betweenus-ae90e"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* 🧠 USER */
let myId = localStorage.getItem("myId");
if (!myId) {
  myId = "user_" + Math.random();
  localStorage.setItem("myId", myId);
}

let currentId = null;

/* 📤 ส่งข้อความ */
function send() {
  const text = document.getElementById("input").value.trim();

  if (!text) {
    alert("พิมพ์ก่อนนน");
    return;
  }

  db.collection("messages").add({
    content: text,
    owner: myId,
    pickedBy: null,
    replies: [],
    createdAt: Date.now()
  })
  .then(() => {
    document.getElementById("input").value = "";
    alert("ส่งแล้ว!");
  })
  .catch(err => {
    console.error(err);
    alert("ERROR: " + err.message);
  });
}

/* 🎯 สุ่มข้อความ (ไม่ซ้ำ) */
function draw() {
  db.collection("messages").get().then(snapshot => {

    let available = [];

    snapshot.forEach(doc => {
      const data = doc.data();
      if (data.owner !== myId && !data.pickedBy) {
        available.push({ ...data, id: doc.id });
      }
    });

    if (available.length === 0) {
      document.getElementById("randomMsg").innerText = "ไม่มีข้อความแล้ว 💭";
      return;
    }

    const rand = available[Math.floor(Math.random() * available.length)];
    currentId = rand.id;

    db.collection("messages").doc(rand.id).update({
      pickedBy: myId
    });

    document.getElementById("randomMsg").innerText = rand.content;
  });
}

/* 💌 ส่งกำลังใจ */
function sendReply() {
  const text = document.getElementById("reply").value.trim();

  if (!text || !currentId) {
    alert("ยังไม่มีข้อความให้ตอบ");
    return;
  }

  const ref = db.collection("messages").doc(currentId);

  ref.get().then(doc => {
    let old = doc.data().replies || [];

    ref.update({
      replies: [...old, text]
    }).then(() => {
      document.getElementById("reply").value = "";
      alert("ส่งกำลังใจแล้ว 💛");
    });
  });
}

/* 🔔 realtime inbox */
db.collection("messages")
.where("owner", "==", myId)
.onSnapshot(snapshot => {
  const box = document.getElementById("inbox");
  box.innerHTML = "";

  snapshot.forEach(doc => {
    const data = doc.data();

    if (data.replies) {
      data.replies.forEach(r => {
        const div = document.createElement("div");
        div.className = "msg";
        div.innerText = "💛 " + r;
        box.appendChild(div);
      });
    }
  });
});
</script>

</body>
</html>
