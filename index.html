<!DOCTYPE html>
<html>
<head>
  <title>BetweenUs</title>

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <style>
    body {
      font-family: 'Kanit', sans-serif;
      margin: 0;
      text-align: center;
      background: #0f0f14;
      color: white;
    }

    .card {
      margin: 15px auto;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      border-radius: 16px;
      background: #1a1a22;
    }

    textarea {
      width: 90%;
      height: 70px;
      border-radius: 10px;
      border: none;
      padding: 10px;
      font-family: 'Kanit';
    }

    button {
      margin-top: 10px;
      padding: 10px 16px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
    }

    .msg {
      padding: 10px;
      margin-top: 10px;
      border-radius: 12px;
      background: #2a2a35;
    }
  </style>
</head>

<body>

<h2>BetweenUs 💭</h2>

<div class="card">
  <button id="loginBtn" onclick="login()">Login with Google</button>
  <p id="user">กำลังโหลด...</p>
</div>

<div class="card">
  <input id="group" placeholder="ชื่อกลุ่ม"><br>
  <button onclick="joinGroup()">เข้ากลุ่ม</button>
</div>

<div class="card">
  <textarea id="input"></textarea><br>
  <button onclick="send()">ส่ง</button>
</div>

<div class="card">
  <div id="randomMsg" class="msg">...</div>
  <button onclick="draw()">สุ่ม</button>

  <textarea id="reply"></textarea>
  <button onclick="sendReply()">ตอบ</button>
</div>

<div class="card">
  <div id="inbox"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBDKVbIJUrqA_GjpYRbJjor8hfIrd2HGLY",
  authDomain: "betweenus-ae90e.firebaseapp.com",
  projectId: "betweenus-ae90e"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let myId = null;
let groupId = null;
let currentId = null;

/* 🔐 LOGIN */
function login() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
}

/* 🔥 สำคัญสุด: เช็คสถานะ login ตอนเข้าเว็บ */
auth.onAuthStateChanged(user => {
  if (user) {
    myId = user.uid;

    document.getElementById("user").innerText = "👤 " + user.displayName;

    document.getElementById("loginBtn").style.display = "none";
  } else {
    document.getElementById("user").innerText = "ยังไม่ได้ login";
    document.getElementById("loginBtn").style.display = "inline-block";
  }
});

/* 👥 GROUP */
function joinGroup() {
  if (!myId) return alert("login ก่อน");

  groupId = document.getElementById("group").value;
  if (!groupId) return alert("ใส่ชื่อกลุ่ม");

  alert("เข้ากลุ่ม: " + groupId);

  db.collection("messages")
    .where("group", "==", groupId)
    .onSnapshot(updateInbox);
}

/* 📤 SEND */
function send() {
  const text = document.getElementById("input").value.trim();

  if (!myId) return alert("login ก่อน");
  if (!groupId) return alert("เข้ากลุ่มก่อน");
  if (!text) return alert("พิมพ์ก่อน");

  db.collection("messages").add({
    content: text,
    owner: myId,
    group: groupId,
    pickedBy: null,
    replies: [],
    thanks: 0
  });

  document.getElementById("input").value = "";
}

/* 🎯 DRAW */
function draw() {
  if (!groupId) return alert("เข้ากลุ่มก่อน");

  db.collection("messages")
    .where("group", "==", groupId)
    .get()
    .then(snap => {

      let list = [];

      snap.forEach(doc => {
        let d = doc.data();
        if (d.owner !== myId && !d.pickedBy) {
          list.push({...d, id: doc.id});
        }
      });

      if (list.length === 0) {
        document.getElementById("randomMsg").innerText = "ไม่มีข้อความ";
        return;
      }

      let r = list[Math.floor(Math.random()*list.length)];
      currentId = r.id;

      db.collection("messages").doc(r.id).update({
        pickedBy: myId
      });

      document.getElementById("randomMsg").innerText = r.content;
    });
}

/* 💌 REPLY */
function sendReply() {
  const text = document.getElementById("reply").value;

  if (!text || !currentId) return alert("ยังไม่มีข้อความให้ตอบ");

  let ref = db.collection("messages").doc(currentId);

  ref.get().then(doc => {
    let old = doc.data().replies || [];
    ref.update({
      replies: [...old, text]
    });
  });

  document.getElementById("reply").value = "";
}

/* ❤️ THANK */
function sendThanks(id) {
  let ref = db.collection("messages").doc(id);

  ref.get().then(doc => {
    let t = doc.data().thanks || 0;
    ref.update({ thanks: t + 1 });
  });
}

/* 🔔 INBOX */
function updateInbox(snapshot) {
  const box = document.getElementById("inbox");
  box.innerHTML = "";

  snapshot.forEach(doc => {
    let d = doc.data();

    if (d.owner === myId && d.replies.length > 0) {

      d.replies.forEach(r => {
        let div = document.createElement("div");
        div.className = "msg";
        div.innerHTML = `
          💛 ${r}<br>
          ❤️ ${d.thanks}
          <button onclick="sendThanks('${doc.id}')">ขอบคุณ</button>
        `;
        box.appendChild(div);
      });
    }
  });
}
</script>

</body>
</html>
