<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BetweenUs</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a10;
      --surface: #13131c;
      --surface2: #1c1c28;
      --border: rgba(255,255,255,0.08);
      --text: #f0f0f5;
      --muted: rgba(240,240,245,0.45);
      --accent: #a89cff;
      --accent2: #7ecfb3;
      --danger: #ff6b6b;
    }
    body { font-family: 'Kanit', sans-serif; font-weight: 300; background: var(--bg); color: var(--text); min-height: 100vh; padding: 0 0 80px; overflow-x: hidden; }

    /* FLOATING HEARTS */
    .heart-container { position: fixed; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
    .heart { position: absolute; font-size: 20px; opacity: 0; animation: floatHeart ease-out forwards; }
    @keyframes floatHeart {
      0%   { transform: translateY(0) scale(0.7); opacity: 0; }
      15%  { opacity: 0.45; }
      75%  { opacity: 0.25; }
      100% { transform: translateY(-96vh) scale(0.9); opacity: 0.15; }
    }

    .header { padding: 24px 20px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 0.5px solid var(--border); }
    .logo { font-size: 20px; font-weight: 500; letter-spacing: 0.5px; }
    .logo span { color: var(--accent); }
    .user-badge { font-size: 11px; letter-spacing: 1px; color: var(--muted); background: var(--surface2); border: 0.5px solid var(--border); padding: 4px 10px; border-radius: 20px; cursor: pointer; }
    .tabs { display: flex; padding: 0 20px; border-bottom: 0.5px solid var(--border); }
    .tab { flex: 1; text-align: center; padding: 14px 4px; font-size: 14px; font-weight: 300; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .page { display: none; padding: 20px; max-width: 480px; margin: 0 auto; }
    .page.active { display: block; }
    .section-label { font-size: 11px; font-weight: 400; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
    .vent-box { width: 100%; background: var(--surface); border: 0.5px solid var(--border); border-radius: 16px; padding: 16px; color: var(--text); font-family: 'Kanit', sans-serif; font-weight: 300; font-size: 15px; line-height: 1.7; resize: none; min-height: 140px; transition: border-color 0.2s; outline: none; }
    .vent-box:focus { border-color: rgba(168,156,255,0.4); }
    .vent-box::placeholder { color: var(--muted); }
    .char-count { text-align: right; font-size: 12px; color: var(--muted); margin-top: 6px; }
    .btn { width: 100%; padding: 14px; border-radius: 50px; border: none; font-family: 'Kanit', sans-serif; font-weight: 400; font-size: 15px; cursor: pointer; transition: all 0.2s; margin-top: 12px; }
    .btn-primary { background: var(--accent); color: #0a0a10; }
    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost { background: transparent; border: 0.5px solid var(--border); color: var(--muted); }
    .intro-box { background: var(--surface); border: 0.5px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .intro-box h3 { font-size: 16px; font-weight: 500; color: var(--accent); margin-bottom: 8px; }
    .intro-box p { font-size: 13px; line-height: 1.7; color: var(--muted); }
    .random-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 20px; padding: 24px 20px; margin: 16px 0; animation: fadeUp 0.35s ease; }
    .anon-tag { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
    .vent-text { font-size: 16px; line-height: 1.8; color: var(--text); }
    .encourage-area { margin-top: 16px; }
    .encourage-area textarea { width: 100%; background: var(--surface2); border: 0.5px solid var(--border); border-radius: 12px; padding: 12px; color: var(--text); font-family: 'Kanit', sans-serif; font-weight: 300; font-size: 14px; resize: none; min-height: 90px; outline: none; transition: border-color 0.2s; }
    .encourage-area textarea:focus { border-color: rgba(126,207,179,0.3); }
    .encourage-area textarea::placeholder { color: var(--muted); }
    .send-enc-btn { margin-top: 8px; padding: 13px; border-radius: 50px; border: none; background: var(--accent2); color: #0a0a10; font-family: 'Kanit', sans-serif; font-weight: 400; font-size: 14px; cursor: pointer; transition: opacity 0.2s; width: 100%; }
    .send-enc-btn:hover { opacity: 0.8; }
    .send-enc-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* INBOX */
    .inbox-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 14px; animation: fadeUp 0.3s ease; }
    .from-label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    .enc-text { font-size: 15px; line-height: 1.7; color: var(--text); }
    .vent-context { font-size: 12px; line-height: 1.7; color: var(--muted); background: var(--surface2); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; border-left: 2px solid rgba(255,255,255,0.1); }
    .vent-context-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); opacity: 0.6; margin-bottom: 5px; }
    .badge { position: absolute; top: -4px; right: -4px; background: #ff6b6b; color: white; font-size: 10px; font-weight: 500; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    #tab-inbox { position: relative; }

    .spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; display: block; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .feed-empty { text-align: center; color: var(--muted); font-size: 14px; padding: 50px 20px; line-height: 1.8; }
    .no-more { text-align: center; font-size: 13px; color: var(--muted); padding: 30px 20px; line-height: 1.8; }
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface2); border: 0.5px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 50px; font-size: 13px; opacity: 0; transition: all 0.3s; pointer-events: none; white-space: nowrap; z-index: 999; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .shuffle-screen { text-align: center; padding: 60px 20px 30px; }
    .shuffle-icon { font-size: 48px; margin-bottom: 20px; }
    .shuffle-count { font-size: 13px; color: var(--muted); margin-bottom: 28px; line-height: 1.8; }
    .shuffle-hint { font-size: 12px; color: var(--muted); margin-top: 16px; line-height: 1.8; }

    /* MY VENTS */
    .my-vent-item { background: var(--surface); border: 0.5px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: flex-start; gap: 12px; animation: fadeUp 0.3s ease; }
    .my-vent-text { flex: 1; font-size: 14px; line-height: 1.7; color: var(--text); }
    .delete-btn { flex-shrink: 0; background: transparent; border: none; color: var(--danger); font-size: 18px; cursor: pointer; opacity: 0.5; transition: opacity 0.2s; }
    .delete-btn:hover { opacity: 1; }
    .my-vents-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .reset-link { font-size: 12px; color: var(--muted); cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>

<!-- HEART CONTAINER -->
<div class="heart-container" id="heartContainer"></div>

<div class="header">
  <div class="logo">Between<span>Us</span> 💭</div>
  <div class="user-badge" id="userBadge" onclick="switchTab('mine')">...</div>
</div>

<div class="tabs">
  <div class="tab active" id="tab-vent" onclick="switchTab('vent')">ระบาย</div>
  <div class="tab" id="tab-encourage" onclick="switchTab('encourage')">หนุนใจ</div>
  <div class="tab" id="tab-inbox" onclick="switchTab('inbox')">กล่องรับ</div>

</div>

<div class="page active" id="page-vent">
  <div class="intro-box" style="margin-top:20px">
    <h3>พื้นที่ของเธอ</h3>
    <p>ระบายได้เลย ไม่มีชื่อ ไม่มีใครรู้ว่าเป็นของใคร<br>แต่ทุกคนจะได้อ่านและหนุนใจกัน</p>
  </div>
  <div class="section-label">อยากระบายอะไร?</div>
  <textarea class="vent-box" id="ventText" placeholder="ผ่านปีนี้มาจนครึ่งปีแล้ว เป็นยังไงบ้าง..." oninput="updateCount()"></textarea>
  <div class="char-count"><span id="charCount">0</span> ตัวอักษร</div>
  <button class="btn btn-primary" id="sendBtn" onclick="sendVent()" disabled>ส่ง</button>
</div>

<div class="page" id="page-encourage">
  <div style="margin-top:20px" id="encourageArea">
    <div class="feed-empty">กำลังโหลด...</div>
  </div>
</div>

<div class="page" id="page-inbox">
  <div style="margin-top:20px" id="inboxContainer">
    <div class="feed-empty">กำลังโหลด...</div>
  </div>
</div>



<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyBDKVbIJUrqA_GjpYRbJjor8hfIrd2HGLY",
    authDomain: "betweenus-ae90e.firebaseapp.com",
    projectId: "betweenus-ae90e",
    storageBucket: "betweenus-ae90e.firebasestorage.app",
    messagingSenderId: "294950831796",
    appId: "1:294950831796:web:33251ef3088aa73610f9e1"
  });
  const db = firebase.firestore();

  let myId = localStorage.getItem("buId");
  if (!myId) { myId = "u_" + Math.random().toString(36).slice(2,8); localStorage.setItem("buId", myId); }
  document.getElementById("userBadge").textContent = myId;

  let currentVent = null, _remaining = [];

  // ── FLOATING HEARTS (inbox only, 2-3 วิ แล้วกองบนขอบ) ──
  function spawnHearts() {
    const container = document.getElementById("heartContainer");
    const count = 16;
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const h = document.createElement("div");
        h.className = "heart";
        h.textContent = "🤍";
        const size = 12 + Math.random() * 14;
        const left = 4 + Math.random() * 92;
        const duration = 2.2 + Math.random() * 1.2;
        const delay = Math.random() * 0.8;
        h.style.cssText = `
          left: ${left}%;
          bottom: 0px;
          font-size: ${size}px;
          animation-duration: ${duration}s;
          animation-delay: ${delay}s;
          filter: brightness(2) saturate(0);
        `;
        container.appendChild(h);
        // ลบออกหลังจบ animation
        setTimeout(() => h.remove(), (duration + delay + 0.3) * 1000);
      }, i * 100);
    }
  }

  // ── TABS ──
  function switchTab(tab) {
    ["vent","encourage","inbox"].forEach(t => {
      document.getElementById("tab-"+t).classList.toggle("active", t===tab);
      document.getElementById("page-"+t).classList.toggle("active", t===tab);
    });
    if (tab === "encourage") loadEncourageTab();
    if (tab === "inbox") { spawnHearts(); showBadge(0); }
  }

  function updateCount() {
    const v = document.getElementById("ventText").value;
    document.getElementById("charCount").textContent = v.length;
    document.getElementById("sendBtn").disabled = v.trim().length === 0;
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2800);
  }

  function escHtml(s) {
    return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function resetMyId() {
    if (!confirm("รีเซ็ต ID จะทำให้เธอไม่เห็นข้อความเก่าของตัวเองอีก แน่ใจไหม?")) return;
    localStorage.removeItem("buId");
    location.reload();
  }

  // ── SEND VENT ──
  async function sendVent() {
    const ta = document.getElementById("ventText");
    const text = ta.value.trim();
    if (!text) return;
    const btn = document.getElementById("sendBtn");
    btn.disabled = true; btn.textContent = "กำลังส่ง...";
    try {
      await db.collection("vents").add({ text, userId: myId, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      ta.value = "";
      document.getElementById("charCount").textContent = "0";
      showToast("ส่งแล้ว 💌");
    } catch(e) { showToast("เกิดข้อผิดพลาด: " + e.message); }
    btn.disabled = false; btn.textContent = "ส่ง";
  }

  // ── MY VENTS ──
  async function loadMyVents() {
    const c = document.getElementById("myVentsContainer");
    c.innerHTML = `<div class="feed-empty"><span class="spinner"></span></div>`;
    try {
      const snap = await db.collection("vents").where("userId","==",myId).get();
      if (snap.empty) { c.innerHTML = `<div class="feed-empty">เธอยังไม่ได้ระบายอะไรเลย 🌿</div>`; return; }
      c.innerHTML = snap.docs.map(d => `
        <div class="my-vent-item" id="myvent-${d.id}">
          <div class="my-vent-text">${escHtml(d.data().text)}</div>
          <button class="delete-btn" onclick="deleteMyVent('${d.id}')">🗑</button>
        </div>`).join("");
    } catch(e) { c.innerHTML = `<div class="feed-empty">โหลดไม่ได้: ${e.message}</div>`; }
  }

  async function deleteMyVent(id) {
    if (!confirm("ลบข้อความนี้?")) return;
    try {
      await db.collection("vents").doc(id).delete();
      document.getElementById("myvent-"+id)?.remove();
      showToast("ลบแล้ว 🗑");
      const c = document.getElementById("myVentsContainer");
      if (!c.querySelector(".my-vent-item")) c.innerHTML = `<div class="feed-empty">เธอยังไม่ได้ระบายอะไรเลย 🌿</div>`;
    } catch(e) { showToast("ลบไม่ได้: " + e.message); }
  }

  // ── ENCOURAGE TAB ──
  async function loadEncourageTab() {
    const area = document.getElementById("encourageArea");
    area.innerHTML = `<div class="feed-empty"><span class="spinner"></span></div>`;
    currentVent = null;
    try {
      const snap = await db.collection("vents").orderBy("createdAt","desc").get();
      const all = snap.docs.filter(d => d.data().userId !== myId);
      if (all.length === 0) { area.innerHTML = `<div class="feed-empty">ยังไม่มีใครระบายเลย<br>รอให้คนอื่นมาระบายก่อนนะ 🌿</div>`; return; }

      const doneSnap = await db.collection("encouraged").doc(myId).get();
      const doneIds = doneSnap.exists ? (doneSnap.data().ventIds || []) : [];
      _remaining = all.filter(d => !doneIds.includes(d.id));

      if (_remaining.length === 0) {
        area.innerHTML = `<div class="no-more">✨ เธอหนุนใจทุกคนครบแล้ว!<br><span style="color:var(--accent2)">ขอบคุณมากเลยนะ</span><br><br><button class="btn btn-primary" style="max-width:200px;margin:0 auto" onclick="loadEncourageTab()">โหลดใหม่</button></div>`;
        return;
      }
      area.innerHTML = `
        <div class="shuffle-screen">
          <div class="shuffle-icon">🎲</div>
          <div class="shuffle-count">มี ${_remaining.length} ข้อความที่รอการหนุนใจอยู่</div>
          <button class="btn btn-primary" style="max-width:200px;margin:0 auto;font-size:15px" onclick="revealVent()">สุ่มเลย</button>
          <div class="shuffle-hint">กดแล้วจะได้รับข้อความของคนคนหนึ่ง<br>ที่รอการหนุนใจจากเธออยู่</div>
        </div>`;
    } catch(e) { area.innerHTML = `<div class="feed-empty">โหลดไม่ได้: ${e.message}</div>`; }
  }

  function revealVent() {
    if (_remaining.length === 0) { loadEncourageTab(); return; }
    const picked = _remaining[Math.floor(Math.random() * _remaining.length)];
    currentVent = { id: picked.id, ...picked.data() };
    document.getElementById("encourageArea").innerHTML = `
      <div class="random-card">
        <div class="anon-tag">익명 · ไม่ระบุตัวตน</div>
        <div class="vent-text">${escHtml(currentVent.text)}</div>
        <div class="encourage-area">
          <textarea id="encText" placeholder="หนุนใจให้เพื่อนหน่อยนะ..." maxlength="300"></textarea>
          <button class="send-enc-btn" id="encBtn" onclick="sendEncouragement()">ส่งกำลังใจ</button>
        </div>
      </div>
      <button class="btn btn-ghost" onclick="loadEncourageTab()">สุ่มใหม่</button>`;
  }

  async function sendEncouragement() {
    const msg = document.getElementById("encText")?.value.trim();
    if (!msg || !currentVent) return;
    const btn = document.getElementById("encBtn");
    btn.disabled = true; btn.textContent = "กำลังส่ง...";
    try {
      await db.collection("inbox").doc(currentVent.userId).collection("messages").add({
        encouragement: msg,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      await db.collection("encouraged").doc(myId).set({
        ventIds: firebase.firestore.FieldValue.arrayUnion(currentVent.id)
      }, { merge: true });
      showToast("หนุนใจแล้ว ❤️");
      loadEncourageTab();
    } catch(e) {
      showToast("เกิดข้อผิดพลาด: " + e.message);
      const b = document.getElementById("encBtn");
      if (b) { b.disabled = false; b.textContent = "หนุนใจ"; }
    }
  }

  // ── INBOX (realtime + hearts on first load) ──
  let inboxFirstLoad = true;
  let lastInboxCount = 0;

  function showBadge(count) {
    const tab = document.getElementById("tab-inbox");
    let badge = tab.querySelector(".badge");
    if (count <= 0) { if (badge) badge.remove(); return; }
    if (!badge) { badge = document.createElement("div"); badge.className = "badge"; tab.appendChild(badge); }
    badge.textContent = count > 9 ? "9+" : count;
  }

  function loadInbox() {
    db.collection("inbox").doc(myId).collection("messages")
      .orderBy("createdAt","desc")
      .onSnapshot(snap => {
        const c = document.getElementById("inboxContainer");
        if (snap.empty) {
          c.innerHTML = `<div class="feed-empty">ยังไม่มีข้อความหนุนใจ<br>ลองไประบายก่อนแล้วรอนะ 💜</div>`;
          inboxFirstLoad = false;
          return;
        }

        const onInbox = document.getElementById("page-inbox").classList.contains("active");
        const newCount = snap.size;

        if (!inboxFirstLoad) {
          if (onInbox) {
            spawnHearts();
          } else if (newCount > lastInboxCount) {
            showBadge(newCount - lastInboxCount);
          }
        }
        inboxFirstLoad = false;
        lastInboxCount = newCount;

        c.innerHTML = snap.docs.map(d => {
          const data = d.data();
          const ventCtx = data.ventText ? `
            <div class="vent-context">
              <div class="vent-context-label">สิ่งที่เธอระบาย</div>
              ${escHtml(data.ventText)}
            </div>` : "";
          return `
            <div class="inbox-card">
              ${ventCtx}
              <div class="from-label">💬 รับไปการหนุนใจจากคนที่บางครั้งเราก็ไม่ต้องรู้ก็ได้ว่าคือใคร❤️‍🔥</div>
              <div class="enc-text">${escHtml(data.encouragement)}</div>
            </div>`;
        }).join("");
      });
  }

  loadInbox();
</script>
</body>
</html>
